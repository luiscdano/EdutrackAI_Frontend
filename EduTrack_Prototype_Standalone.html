<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315765"><title>EduTrack — Prototipo completo</title><style>

:root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body, #root { margin:0; min-height:100%; }
button, input, select { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:not-allowed; opacity:.58; }

.prototype {
  --page:#f2f4f0; --paper:#fffefa; --soft:#f7f9f6; --line:#d9e0da; --ink:#25343a; --muted:#6f7c80;
  --blue:#315765; --blue-strong:#244651; --blue-soft:#e6eef0; --green:#75998c; --green-soft:#e8f0ec;
  --sand:#efe5d6; --attention:#9b6d35; --attention-soft:#f5eadb; --danger:#a95d57;
  --shadow:0 12px 32px rgba(37,52,58,.055); --radius:14px;
  min-height:100vh; background:var(--page); color:var(--ink); font-size:14px; line-height:1.5;
}
.prototype.dark {
  --page:#182126; --paper:#202b30; --soft:#27343a; --line:#39474d; --ink:#edf3f1; --muted:#a8b6b4;
  --blue:#9dbbc6; --blue-strong:#b8cfd7; --blue-soft:#293e46; --green:#96b6aa; --green-soft:#293e38;
  --sand:#3d382f; --attention:#ddb77f; --attention-soft:#40372b; --danger:#e39a93; --shadow:0 12px 32px rgba(0,0,0,.18);
  color-scheme:dark;
}
svg { width:20px; height:20px; }
.contents { display:contents; }
.brand { display:flex; align-items:center; gap:11px; }
.brand-logo { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; background:var(--blue-strong); color:var(--paper); flex:0 0 auto; }
.brand b { display:block; font-size:16px; }
.brand small { display:block; color:var(--muted); font-size:10px; font-weight:500; }
.brand-light .brand-logo { background:#fff; color:#315765; }
.brand-light small { color:rgba(255,255,255,.62); }
.eyebrow, .section-label { color:var(--green); text-transform:uppercase; letter-spacing:.12em; font-size:10px; font-weight:750; }
.muted { color:var(--muted); }
.small { font-size:12px; }
.full { width:100%; }
.panel { background:var(--paper); border-radius:var(--radius); box-shadow:var(--shadow); padding:18px; }
.panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:14px; }
.panel-head h2 { margin:2px 0 0; font-size:17px; line-height:1.3; letter-spacing:-.01em; }
.panel-head p { margin:3px 0 0; color:var(--muted); font-size:12px; }
.btn { min-height:39px; border:0; border-radius:10px; padding:9px 13px; display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:680; color:var(--ink); background:var(--soft); }
.btn svg { width:17px; height:17px; }
.btn.primary { color:var(--paper); background:var(--blue-strong); }
.btn.secondary { background:var(--soft); color:var(--ink); }
.btn.soft { background:var(--green-soft); color:var(--green); }
.btn.quiet { background:transparent; color:var(--muted); }
.btn.large { min-height:46px; padding-inline:18px; }
.button-row { display:flex; flex-wrap:wrap; gap:9px; margin-top:16px; }
.button-row.centered { justify-content:center; }
.text-button { border:0; background:transparent; color:var(--blue); display:inline-flex; align-items:center; gap:4px; font-weight:650; padding:4px; }
.text-button svg { width:15px; height:15px; }
.icon-button { width:38px; height:38px; display:grid; place-items:center; border:0; border-radius:10px; color:var(--ink); background:var(--soft); }
.icon-button:hover { background:var(--blue-soft); color:var(--blue); }
.badge { display:inline-flex; align-items:center; width:max-content; border-radius:999px; padding:5px 9px; background:var(--blue-soft); color:var(--blue); font-size:10px; font-weight:730; }
.badge.attention, .status.attention { background:var(--attention-soft); color:var(--attention); }
.badge.good, .status.good { background:var(--green-soft); color:var(--green); }
.badge.neutral, .status.neutral { background:var(--soft); color:var(--muted); }
.progress { height:8px; border-radius:999px; overflow:hidden; background:var(--soft); }
.progress i { display:block; height:100%; border-radius:inherit; background:var(--green); }
.meta-row { display:flex; flex-wrap:wrap; align-items:center; gap:7px; }
.meta-row > span:not(.badge) { border-radius:8px; background:var(--soft); color:var(--muted); padding:6px 8px; font-size:11px; }
.form-stack { display:grid; gap:14px; margin-top:22px; }
.form-two, .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.form-grid { margin-top:20px; }
.form-grid .wide { grid-column:1/-1; }
label { display:grid; gap:6px; font-size:11px; font-weight:650; }
input, select { width:100%; min-height:42px; border:1px solid var(--line); border-radius:10px; outline:none; padding:9px 11px; color:var(--ink); background:var(--paper); }
input:focus, select:focus { border-color:var(--blue); box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 12%,transparent); }
input:disabled, select:disabled { color:var(--muted); background:var(--soft); }
.check { display:flex; align-items:center; gap:7px; font-weight:500; }
.check input { width:auto; min-height:0; }
.segmented { display:grid; grid-template-columns:1fr 1fr; gap:4px; padding:4px; background:var(--soft); border-radius:11px; }
.segmented button { border:0; border-radius:8px; background:transparent; color:var(--muted); padding:9px; font-weight:650; }
.segmented button.active { color:var(--ink); background:var(--paper); box-shadow:0 2px 8px rgba(37,52,58,.05); }
.segmented.small { width:max-content; }
.segmented.small button { padding:7px 12px; font-size:12px; }
.calm-note, .privacy-note { border-radius:11px; padding:13px; background:var(--green-soft); color:var(--green); }
.calm-note p { margin:4px 0 0; color:var(--muted); font-size:12px; }
.toast { position:fixed; z-index:100; right:22px; bottom:22px; display:flex; align-items:center; gap:9px; max-width:420px; background:var(--blue-strong); color:var(--paper); padding:12px 14px; border-radius:12px; box-shadow:0 18px 44px rgba(0,0,0,.18); }
.toast svg { width:18px; height:18px; }

/* Authentication */
.auth-shell { display:grid; grid-template-columns:minmax(380px,.96fr) minmax(410px,1.04fr); min-height:100vh; }
.auth-identity { position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; padding:36px; color:#fff; background:#315765; }
.auth-identity:before { content:""; position:absolute; inset:0; opacity:.07; background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px); background-size:34px 34px; }
.auth-identity > * { position:relative; z-index:1; }
.identity-copy { max-width:520px; }
.identity-kicker { display:inline-flex; align-items:center; gap:7px; border-radius:999px; padding:7px 10px; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07); color:rgba(255,255,255,.82); font-size:11px; }
.identity-kicker svg { width:17px; height:17px; }
.identity-copy h1 { max-width:480px; margin:17px 0 13px; font-size:clamp(34px,4vw,46px); line-height:1.08; letter-spacing:-.04em; }
.identity-copy > p { max-width:480px; margin:0; color:rgba(255,255,255,.76); font-size:15px; line-height:1.7; }
.identity-journey { margin-top:28px; padding:16px; border-radius:15px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.075); }
.journey-title { display:flex; justify-content:space-between; gap:10px; margin-bottom:12px; font-size:12px; }
.journey-title span { color:rgba(255,255,255,.62); font-size:10px; }
.journey-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.journey-card { min-height:104px; border-radius:11px; padding:11px; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.06); }
.journey-card.active { background:rgba(255,255,255,.14); }
.journey-card > span { width:26px; height:26px; display:grid; place-items:center; border-radius:50%; background:rgba(255,255,255,.12); font-size:10px; font-weight:700; }
.journey-card.active > span { background:#fff; color:#315765; }
.journey-card b, .journey-card small { display:block; }
.journey-card b { margin-top:9px; font-size:11px; }
.journey-card small { margin-top:3px; color:rgba(255,255,255,.58); font-size:9px; }
.identity-footer { display:flex; justify-content:space-between; gap:12px; color:rgba(255,255,255,.58); font-size:10px; }
.identity-footer span:first-child { display:flex; align-items:center; gap:7px; }
.identity-footer i { width:8px; height:8px; border-radius:50%; background:#a8c6b9; }
.auth-form-side { display:grid; place-items:center; padding:30px; background:var(--paper); }
.auth-card { width:min(100%,440px); }
.mobile-brand { display:none; }
.auth-card h2 { margin:7px 0 7px; font-size:28px; line-height:1.18; letter-spacing:-.026em; }
.auth-card > .muted { margin:0; line-height:1.65; }
.form-inline { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font-size:11px; }
.divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:10px; }
.divider:before,.divider:after { content:""; height:1px; flex:1; background:var(--line); }
.privacy-note { display:grid; grid-template-columns:30px 1fr; gap:9px; margin-top:18px; font-size:10px; }
.privacy-note svg { width:18px; height:18px; }

/* Onboarding */
.onboarding-shell { min-height:100vh; background:var(--page); }
.onboarding-header { display:flex; align-items:center; justify-content:space-between; padding:16px 26px; background:var(--paper); box-shadow:var(--shadow); }
.onboarding-wrap { width:min(100%,980px); margin:auto; padding:28px 20px 40px; }
.stepper { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:20px; }
.stepper-item { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; }
.stepper-item > span { width:29px; height:29px; display:grid; place-items:center; border-radius:50%; background:var(--paper); box-shadow:var(--shadow); }
.stepper-item > span svg { width:15px; height:15px; }
.stepper-item.active,.stepper-item.done { color:var(--blue); }
.stepper-item.active > span,.stepper-item.done > span { color:var(--paper); background:var(--blue-strong); }
.onboarding-grid { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr); gap:18px; }
.onboarding-main { min-height:500px; }
.onboarding-main h2 { margin:7px 0; font-size:25px; letter-spacing:-.025em; }
.onboarding-main > .muted { margin:0; }
.onboarding-summary h3 { margin:8px 0 15px; font-size:20px; }
.summary-list { display:grid; gap:9px; }
.summary-list > div { display:flex; justify-content:space-between; gap:12px; padding-bottom:9px; border-bottom:1px solid var(--line); font-size:11px; }
.summary-list > div:last-child { border:0; }
.summary-list span { color:var(--muted); }
.onboarding-summary .calm-note { margin-top:18px; }
.choice-group { margin-top:19px; }
.choice-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:8px; }
.choice { border:1px solid var(--line); border-radius:11px; padding:12px; text-align:left; background:var(--paper); color:var(--ink); }
.choice.selected { border-color:color-mix(in srgb,var(--green) 45%,var(--line)); background:var(--green-soft); }
.choice b,.choice small { display:block; }
.choice small { margin-top:3px; color:var(--muted); font-size:10px; }
.ready-card { margin-top:20px; border-radius:12px; padding:17px; background:var(--sand); }
.ready-card p { margin:5px 0 0; color:var(--muted); }
.preview-process { display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-top:16px; }
.preview-process > div { display:flex; align-items:center; gap:10px; border-radius:10px; padding:12px; background:var(--soft); }
.preview-process span { width:27px; height:27px; display:grid; place-items:center; border-radius:50%; background:var(--green-soft); color:var(--green); font-weight:700; }
.onboarding-actions { display:flex; justify-content:space-between; gap:10px; margin-top:18px; }

/* App shell */
.app-shell { display:grid; grid-template-columns:218px minmax(0,1fr); min-height:100vh; transition:grid-template-columns .2s ease; }
.app-shell.sidebar-collapsed { grid-template-columns:68px minmax(0,1fr); }
.sidebar { position:relative; z-index:30; min-width:0; display:flex; flex-direction:column; overflow:visible; background:var(--paper); padding:16px 12px; box-shadow:8px 0 26px rgba(37,52,58,.04); }
.sidebar-brand { min-height:42px; display:flex; align-items:center; gap:9px; white-space:nowrap; overflow:hidden; }
.sidebar-brand-copy { min-width:0; opacity:1; transition:opacity .12s ease; }
.sidebar-brand-copy b,.sidebar-brand-copy small { display:block; }
.sidebar-brand-copy small { color:var(--muted); font-size:9px; }
.sidebar-collapse { position:absolute; top:22px; right:-14px; z-index:3; width:29px; height:29px; display:grid; place-items:center; border:0; border-radius:9px; background:var(--paper); color:var(--muted); box-shadow:0 5px 16px rgba(37,52,58,.12); }
.sidebar-collapse:hover { color:var(--blue); background:var(--blue-soft); }
.sidebar-collapse svg { width:17px; height:17px; }
.sidebar-nav { display:grid; gap:4px; margin-top:22px; }
.sidebar-nav button,.logout { min-height:40px; border:0; border-radius:10px; display:flex; align-items:center; gap:10px; padding:9px 10px; overflow:hidden; white-space:nowrap; text-align:left; color:var(--muted); background:transparent; }
.sidebar-nav button:hover,.sidebar-nav button.active { color:var(--blue); background:var(--blue-soft); }
.sidebar-nav button svg,.logout svg { width:18px; height:18px; flex:0 0 auto; }
.sidebar-nav button span,.logout span { transition:opacity .12s ease; }
.sidebar-help { margin-top:auto; border-radius:11px; padding:11px; background:var(--green-soft); color:var(--green); font-size:10px; transition:opacity .12s ease; }
.sidebar-help p { margin:3px 0 0; color:var(--muted); }
.logout { margin-top:8px; }
.sidebar-collapsed .sidebar { padding-inline:13px; }
.sidebar-collapsed .sidebar-brand-copy,.sidebar-collapsed .sidebar-help,.sidebar-collapsed .sidebar-nav span,.sidebar-collapsed .logout span { opacity:0; pointer-events:none; }
.sidebar-collapsed .sidebar-brand { justify-content:center; }
.sidebar-collapsed .brand-logo { width:40px; height:40px; }
.sidebar-collapsed .sidebar-nav button,.sidebar-collapsed .logout { justify-content:center; padding-inline:0; }
.app-main { min-width:0; }
.topbar { min-height:64px; display:flex; align-items:center; gap:9px; padding:11px 20px; background:var(--paper); box-shadow:0 8px 24px rgba(37,52,58,.035); position:sticky; top:0; z-index:20; }
.mobile-menu-button { display:none; width:38px; height:38px; border:0; border-radius:10px; background:var(--soft); color:var(--ink); }
.search-box { width:min(100%,430px); min-height:40px; border:0; border-radius:10px; display:flex; align-items:center; gap:8px; padding:9px 11px; color:var(--muted); background:var(--soft); text-align:left; }
.search-box span { flex:1; }
.search-box kbd { border-radius:6px; padding:3px 6px; background:var(--paper); color:var(--muted); font:10px ui-monospace,monospace; }
.period-chip { margin-left:auto; border-radius:8px; padding:7px 9px; color:var(--muted); background:var(--soft); font-size:10px; }
.notification-button { position:relative; }
.notification-button i { position:absolute; top:7px; right:7px; width:6px; height:6px; border-radius:50%; background:var(--attention); }
.avatar-button { width:38px; height:38px; border:0; border-radius:10px; background:var(--green-soft); color:var(--green); font-weight:750; }
.page-content { padding:23px; }
.page-stack { display:grid; gap:16px; }
.page-header { display:flex; justify-content:space-between; align-items:flex-end; gap:18px; }
.page-header h1 { margin:4px 0 4px; font-size:clamp(21px,2.2vw,28px); line-height:1.2; letter-spacing:-.025em; }
.page-header p { max-width:720px; margin:0; color:var(--muted); line-height:1.6; }
.home-grid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr); gap:15px; }
.priority-card { background:linear-gradient(135deg,var(--paper),color-mix(in srgb,var(--blue-soft) 34%,var(--paper)),color-mix(in srgb,var(--green-soft) 30%,var(--paper))); }
.priority-body { border-top:1px solid var(--line); padding-top:16px; }
.priority-body h3 { max-width:690px; margin:10px 0 8px; font-size:25px; line-height:1.2; letter-spacing:-.025em; }
.priority-body p { max-width:720px; margin:0; color:var(--muted); }
.big-number { font-size:24px; }
.agenda-list { display:grid; gap:8px; margin-top:13px; }
.agenda-list > div { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:10px; border-radius:10px; padding:10px; background:var(--soft); }
.agenda-list i { width:9px; height:9px; border-radius:50%; }
.agenda-list i.green { background:var(--green); }.agenda-list i.blue { background:var(--blue); }.agenda-list i.sand { background:var(--attention); }
.agenda-list b,.agenda-list small { display:block; }
.agenda-list small { color:var(--muted); font-size:10px; }
.agenda-list em { color:var(--muted); font-size:9px; font-style:normal; }
.agenda-list.large > div { padding:13px; }
.path-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.path-card { border:1px solid var(--line); border-radius:11px; padding:12px; text-align:left; color:var(--ink); background:var(--soft); }
.path-card.active { background:var(--green-soft); border-color:color-mix(in srgb,var(--green) 35%,var(--line)); }
.path-card > span { width:27px; height:27px; display:grid; place-items:center; border-radius:50%; background:var(--paper); font-size:10px; font-weight:700; }
.path-card.active > span { color:var(--paper); background:var(--green); }
.path-card b,.path-card small { display:block; }
.path-card b { margin-top:9px; font-size:12px; }.path-card small { margin-top:3px; color:var(--muted); font-size:10px; }
.two-column { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
.insight-list { display:grid; gap:8px; }
.insight-list article,.history-list > div { border-radius:10px; padding:12px; background:var(--soft); }
.insight-list p { margin:3px 0 0; color:var(--muted); font-size:11px; }
.metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.metric-grid > div,.profile-metrics > div,.subject-overview > div,.comparison > div { border-radius:10px; padding:11px; background:var(--soft); }
.metric-grid span,.profile-metrics span,.subject-overview span,.comparison span { display:block; color:var(--muted); font-size:10px; }
.metric-grid b,.profile-metrics b,.subject-overview b,.comparison b { display:block; margin-top:2px; font-size:16px; }
.plan-timeline { display:grid; gap:8px; }
.plan-timeline button { display:grid; grid-template-columns:32px 1fr auto; align-items:center; gap:11px; border:0; border-radius:11px; padding:12px; text-align:left; color:var(--ink); background:var(--soft); }
.plan-timeline button > span { width:30px; height:30px; display:grid; place-items:center; border-radius:50%; background:var(--paper); font-size:10px; font-weight:700; }
.plan-timeline button > span svg { width:15px; height:15px; }
.plan-timeline button.done { background:var(--green-soft); }.plan-timeline button.done > span { color:var(--paper); background:var(--green); }
.plan-timeline b,.plan-timeline small { display:block; }.plan-timeline small { color:var(--muted); font-size:10px; }.plan-timeline em { color:var(--muted); font-size:10px; font-style:normal; }
.subjects-layout { display:grid; grid-template-columns:minmax(245px,.72fr) minmax(0,1.28fr); gap:15px; }
.subject-list { display:grid; gap:9px; align-content:start; }
.subject-list-card { display:grid; grid-template-columns:1fr auto; gap:9px; border:0; border-radius:12px; padding:14px; text-align:left; color:var(--ink); background:var(--paper); box-shadow:var(--shadow); }
.subject-list-card.active { outline:2px solid color-mix(in srgb,var(--blue) 28%,transparent); background:color-mix(in srgb,var(--blue-soft) 35%,var(--paper)); }
.subject-list-card small,.subject-list-card b { display:block; }.subject-list-card small { color:var(--muted); font-size:9px; }.subject-list-card b { margin:3px 0 7px; }
.subject-list-card strong { font-size:22px; }.subject-list-card .progress { grid-column:1/-1; }
.status { display:inline-flex; width:max-content; border-radius:999px; padding:4px 7px; font-size:9px; background:var(--soft); color:var(--muted); }
.subject-overview { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
.topic-list { display:grid; gap:11px; margin-top:18px; }
.topic-list > div > div:first-child { display:flex; justify-content:space-between; gap:10px; margin-bottom:5px; font-size:11px; }
.toolbar { display:flex; justify-content:space-between; gap:12px; align-items:center; }
.filter-tabs { display:flex; flex-wrap:wrap; gap:5px; padding:4px; border-radius:10px; background:var(--soft); }
.filter-tabs button { border:0; border-radius:7px; padding:7px 11px; color:var(--muted); background:transparent; font-size:11px; }
.filter-tabs button.active { color:var(--ink); background:var(--paper); box-shadow:0 2px 7px rgba(37,52,58,.05); }
.resource-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.resource-card { overflow:hidden; border-radius:13px; background:var(--paper); box-shadow:var(--shadow); }
.resource-cover { min-height:110px; display:flex; align-items:flex-end; justify-content:space-between; padding:14px; color:var(--blue); background:linear-gradient(135deg,var(--blue-soft),var(--green-soft)); }
.resource-cover svg { width:32px; height:32px; }.resource-cover span { border-radius:999px; padding:5px 8px; color:var(--blue); background:var(--paper); font-size:9px; font-weight:700; }
.resource-body { padding:14px; }.resource-meta { display:flex; justify-content:space-between; gap:9px; color:var(--muted); font-size:9px; }.resource-body h3 { min-height:44px; margin:8px 0; font-size:15px; line-height:1.35; }
.resource-progress { display:grid; gap:5px; margin:13px 0; }.resource-progress small { color:var(--muted); font-size:9px; }
.progress-layout { display:grid; grid-template-columns:minmax(0,1.25fr) minmax(250px,.75fr); gap:15px; }
.mastery-table { display:grid; grid-template-columns:150px repeat(4,1fr); gap:7px; min-width:610px; }
.mastery { overflow:auto; }.mastery-table > * { border-radius:9px; padding:10px; text-align:center; background:var(--soft); font-size:10px; }
.mastery-table > strong { text-align:left; }.mastery-table span.high { background:var(--green-soft); color:var(--green); }.mastery-table span.low { background:var(--attention-soft); color:var(--attention); }
.progress-side { display:grid; gap:15px; }.impact-number { display:block; margin:10px 0 2px; color:var(--green); font-size:36px; }.impact-card p { color:var(--muted); }
.comparison { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:13px 0; }
.history-list { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }.history-list b,.history-list span { display:block; }.history-list span { margin-top:3px; color:var(--muted); font-size:10px; }
.recommendation-list { display:grid; gap:12px; }
.recommendation-card { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(220px,.7fr); gap:14px; border-radius:14px; padding:17px; background:var(--paper); box-shadow:var(--shadow); }
.recommendation-card h2 { margin:10px 0 7px; font-size:19px; }.recommendation-card > div > p { margin:0; color:var(--muted); }.recommendation-card aside { border-radius:11px; padding:13px; background:var(--soft); }
.recommendation-card aside span,.recommendation-card aside b { display:block; }.recommendation-card aside span { color:var(--muted); font-size:9px; }.recommendation-card aside b { margin:2px 0 12px; font-size:17px; }.recommendation-card aside p { margin:3px 0 0; color:var(--muted); font-size:10px; }
.session-layout { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(250px,.85fr); gap:15px; }
.timer-panel { text-align:center; padding:25px; }.timer-panel h2 { max-width:620px; margin:16px auto 0; font-size:21px; }.timer { margin:24px 0 10px; font:750 clamp(52px,7vw,76px)/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:-.06em; }
.resource-focus { margin-top:20px; border-radius:11px; padding:14px; text-align:left; background:var(--soft); }.resource-focus b,.resource-focus p { display:block; }.resource-focus p { margin:4px 0 0; color:var(--muted); font-size:11px; }
.session-steps { align-content:start; }.session-step { display:flex; gap:10px; align-items:center; border-radius:10px; padding:12px; margin-top:8px; background:var(--soft); }.session-step.active { background:var(--green-soft); }.session-step > span { width:29px; height:29px; display:grid; place-items:center; border-radius:50%; background:var(--paper); font-size:10px; font-weight:700; }.session-step.active > span { color:var(--paper); background:var(--green); }.session-step b,.session-step small { display:block; }.session-step small { color:var(--muted); font-size:10px; }
.profile-layout { display:grid; grid-template-columns:minmax(245px,.7fr) minmax(0,1.3fr); gap:15px; }.profile-summary { text-align:center; }.profile-avatar { width:82px; height:82px; display:grid; place-items:center; margin:0 auto 12px; border-radius:22px; color:var(--blue); background:var(--blue-soft); font-size:24px; font-weight:750; }.profile-summary h2 { margin:0; }.profile-summary > p { margin:3px 0 10px; color:var(--muted); font-size:11px; }.profile-summary .summary-list { margin-top:16px; text-align:left; }.profile-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:14px; }.profile-panels { display:grid; gap:15px; }
.settings-layout { display:grid; grid-template-columns:210px minmax(0,1fr); gap:15px; }.settings-nav { display:grid; align-content:start; gap:5px; }.settings-nav button { border:0; border-radius:9px; padding:10px; text-align:left; color:var(--muted); background:transparent; }.settings-nav button.active { color:var(--blue); background:var(--blue-soft); font-weight:650; }.settings-panel > .btn { margin-top:14px; }
.setting-row,.toggle-row { display:flex; align-items:center; justify-content:space-between; gap:15px; border-bottom:1px solid var(--line); padding:13px 0; }.setting-row:last-of-type,.toggle-row:last-of-type { border-bottom:0; }.setting-row > div b,.setting-row > div span,.toggle-row b,.toggle-row small { display:block; }.setting-row > div span,.toggle-row small { margin-top:2px; color:var(--muted); font-size:10px; }.setting-row select { width:180px; }.toggle-row input { width:18px; min-height:18px; accent-color:var(--green); }
.security-status { display:flex; align-items:center; gap:10px; border-radius:11px; padding:13px; margin-bottom:8px; color:var(--green); background:var(--green-soft); }.security-status svg { width:22px; height:22px; }.security-status b,.security-status span { display:block; }.security-status span { color:var(--muted); font-size:10px; }
.admin-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }.admin-summary .panel span,.admin-summary .panel b,.admin-summary .panel small { display:block; }.admin-summary .panel span { color:var(--muted); font-size:10px; }.admin-summary .panel b { margin:4px 0; font-size:20px; }.admin-summary .panel small { color:var(--muted); font-size:9px; }
.admin-table { overflow:auto; }.table-head,.table-row { min-width:620px; display:grid; grid-template-columns:1.5fr .7fr .7fr .7fr 40px; align-items:center; gap:10px; padding:10px; }.table-head { color:var(--muted); font-size:10px; }.table-row { border-radius:10px; margin-top:5px; background:var(--soft); font-size:11px; }.table-row .icon-button { width:32px; height:32px; }
